spring.application.name=inventario
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inventario_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Guatemala&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Guatemala

spring.thymeleaf.cache=false
spring.mvc.format.date-time=dd/MM/yyyy HH:mm

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.error.whitelabel.enabled=false
server.servlet.session.tracking-modes=cookie
